name: tests

# Laeuft die Headless-Testsuite (reine Logik, kein GUI/Spiel noetig) bei jedem
# Push und Pull-Request. Windows-Runner, weil einige Module pywin32/CustomTkinter
# importieren.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20 # Backstop: haengender GUI-Test soll nicht 6 h in den Default-Timeout laufen
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary pytest pytest-timeout

      - name: Tests
        # pytest statt 'unittest discover': Teile der Suite (z.B. seher) sind
        # pytest-nativ (Fixtures/parametrize) und laufen NICHT unter unittest
        # (-> seit 06-10 ImportError 'No module named pytest' = CI chronisch rot).
        # pytest fuehrt unittest.TestCase UND pytest-Tests aus -> exakt das, was
        # lokal gruen ist, plus die GUI-Tests (customtkinter via requirements;
        # Windows-Runner hat Desktop -> test_gui_smoke laeuft real und faengt
        # App-Start-/Rail-Regressionen wie den v1.2.6-KeyError).
        #
        # ZEITLIMIT JE TEST (neu 2026-09-10). Bisher hing dieser Lauf regelmaessig
        # bis in den 20-Minuten-Backstop des Jobs und wurde dann hart abgebrochen
        # -- ohne eine einzige Zeile darueber, WO er haengt. Seit v1.6.6 war die
        # Windows-Pruefung damit faktisch blind.
        #
        # release.yml hat dasselbe Problem anders geloest: es waehlt eine
        # Logik-Teilmenge aus und umgeht die Haenger. Hier wird bewusst NICHT
        # ausgewaehlt -- sonst verliert man genau die Tests, die nur auf Windows
        # etwas beweisen (GUI-Aufbau, pywin32). Stattdessen bekommt jeder Test
        # 120 s; wer laenger braucht, haengt, und pytest-timeout schreibt seinen
        # Stacktrace ins Protokoll. Der naechste Lauf benennt den Schuldigen also
        # selbst, statt dass jemand raten muss.
        #
        # 'thread' ist auf Windows die einzige Methode, die funktioniert
        # (signal-basierte Unterbrechung gibt es dort nicht).
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --timeout=120 --timeout-method=thread
