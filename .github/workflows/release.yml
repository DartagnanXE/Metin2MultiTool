name: release

# Baut die portable Windows-EXE (PyInstaller --onefile, identisch zu build.bat)
# und veroeffentlicht sie als GitHub-Release. Der In-App-Updater (updater.py)
# zieht das Asset 'Metin2MultiTool-Portable.exe' von /releases/latest.
#
# Trigger: manuell (workflow_dispatch) ODER Push eines Tags 'v*'.
# Der Tag/Titel/die Notes ergeben sich aus version.py + CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # noetig fuer 'gh release create/upload/edit'

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30 # harter Backstop: nie in den 6-h-Default-Timeout laufen
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary pytest pytest-timeout

      # Executable-Gate: POSITIV die Logik-Tests der 1.6.0-geaenderten Module
      # (puzzle/deluxe/solver/tracker/fishing/refill/cursor). Bewusst NICHT die
      # volle Suite: GUI-Tests (customtkinter-Event-Loop) UND der IPC-Test
      # (test_worker_ipc: os.close(fd) blockiert auf Windows im tearDown) HAENGEN
      # auf dem Runner -> das war der 6-h-Default-Timeout seit v1.5.0. Diese Datei-
      # Auswahl ist rein Logik (kein GUI/IPC/app-Import) und deckt exakt den Diff
      # ab. --timeout=90 + job-timeout-minutes sind zusaetzliche Backstops.
      - name: Tests (Logik-Gate der 1.6.0-Aenderungen)
        run: >
          python -m pytest -q -p no:cacheprovider
          --timeout=90 --timeout-method=thread
          tests/test_puzzle_deluxe_opportunistic.py
          tests/test_puzzle_event_flow.py
          tests/test_puzzle_glue.py
          tests/test_puzzle_hardening.py
          tests/test_puzzle_safety.py
          tests/test_deluxe.py
          tests/test_solver.py
          tests/test_solver_optimality.py
          tests/test_trained_solver.py
          tests/test_click_tracker.py
          tests/test_cursor_broker.py
          tests/test_cursor_client.py
          tests/test_fishing_chat.py
          tests/test_fishing_click_recheck.py
          tests/test_fishing_whitelist.py
          tests/test_fishingbot_logic.py
          tests/test_refill.py

      - name: Portable EXE bauen (PyInstaller --onefile)
        run: python -m PyInstaller --clean --noconfirm --distpath dist_onefile Metin2FishBot_onefile.spec

      - name: Asset benennen + Version/Notes vorbereiten
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          # Spec: name=APP_NAME='Metin2MultiTool' -> dist_onefile/Metin2MultiTool.exe.
          # Glob-Fallback, falls APP_NAME je wieder wechselt (genau eine .exe erwartet).
          BUILT=$(ls -1 dist_onefile/*.exe 2>/dev/null | head -1)
          test -n "$BUILT" || { echo "::error::PyInstaller hat keine EXE in dist_onefile/ erzeugt"; ls -la dist_onefile/ || true; exit 1; }
          echo "Gebaute EXE: $BUILT"
          # Updater matcht exakt asset.name == 'Metin2MultiTool-Portable.exe'
          cp "$BUILT" Metin2MultiTool-Portable.exe
          VER=$(python -c "import version; print(version.__version__)")
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          # Release-Notes = CHANGELOG-Abschnitt der aktuellen Version
          awk -v h="## [${VER}]" 'index($0,h){f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Metin2MultiTool v${VER}" > notes.md; fi
          echo "----- Release-Notes (${VER}) -----"
          cat notes.md

      - name: Release veroeffentlichen (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="Metin2MultiTool ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert -> Asset ersetzen + sicher veroeffentlicht halten"
            gh release upload "$TAG" Metin2MultiTool-Portable.exe --clobber
            gh release edit "$TAG" --draft=false --title "$TITLE" --notes-file notes.md
          else
            echo "Release $TAG neu anlegen + veroeffentlichen"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file notes.md \
              Metin2MultiTool-Portable.exe
          fi
          echo "===== Veroeffentlichtes Release ====="
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            -q '"tag=" + .tagName, "draft=" + (.isDraft|tostring), "prerelease=" + (.isPrerelease|tostring), "assets=" + ([.assets[].name]|join(","))'
